<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <style>
    /* =====================================================================
       ESTILOS PUROS SDR OSCURO — CERO DEPENDENCIAS EXTERNAS
       100% fluido para vertical (portrait) y horizontal (landscape)

    :root {
      --bg: #05080d;
      --panel: #0b111b;
      --card: #111a2a;
      --border: #1e2d45;
      --text: #e2e8f0;
      --muted: #8b9bb4;
      --green: #22c55e;
      --cyan: #06b6d4;
      --amber: #f59e0b;
      --red: #ef4444;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image:
        radial-gradient(circle at 12% 4%, rgba(34, 197, 94, 0.08), transparent 36%),
        radial-gradient(circle at 88% 8%, rgba(6, 182, 212, 0.09), transparent 36%);
    }

    /* Toast flotante (reemplaza alert) */
    #toast-container {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(340px, calc(100vw - 24px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: rgba(17, 26, 42, 0.96);
      color: #f1f5f9;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.success { border-color: rgba(34, 197, 94, 0.55); background: rgba(6, 42, 24, 0.96); color: #bbf7d0; }
    .toast.error   { border-color: rgba(239, 68, 68, 0.55); background: rgba(58, 12, 18, 0.96); color: #fecaca; }
    .toast.warn    { border-color: rgba(245, 158, 11, 0.55); background: rgba(56, 36, 8, 0.96); color: #fde68a; }

    /* Encabezado SDR */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(5, 8, 13, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
    }
    .header-inner {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 14px;
      color: #03110c;
      flex-shrink: 0;
    }
    .brand h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-sdr {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .brand-sub {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: var(--muted);
    }

    /* Reloj UTC grande y prioritario */
    .clock-lcd {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 12px;
      background: linear-gradient(180deg, #040a10 0%, #07141f 100%);
      border: 1px solid rgba(6, 182, 212, 0.4);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
      flex: 1 1 auto;
      justify-content: space-between;
      max-width: 380px;
    }
    .utc-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    #utc-clock {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      color: #22d3ee;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.45);
    }
    .utc-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      color: #4ade80;
    }
    #utc-date {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
    }
    .clock-sep {
      width: 1px;
      height: 30px;
      background: #1e2d45;
    }
    .local-box {
      text-align: right;
    }
    .local-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
    }
    #local-clock {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Contenedor principal */
    main {
      max-width: 1260px;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Paneles y tarjetas */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
    }
    .panel-title {
      margin: 0 0 10px 0;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.cyan  { background: var(--cyan);  box-shadow: 0 0 8px var(--cyan); }
    .dot.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
    .dot.red   { background: var(--red);   box-shadow: 0 0 8px var(--red); }

    /* Botones táctiles grandes */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    button, .file-btn {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-align: center;
      transition: transform 0.1s ease, filter 0.15s ease, background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button:active, .file-btn:active {
      transform: scale(0.97);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      color: #04130d;
      border: none;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      color: #fecaca;
      border-color: rgba(239, 68, 68, 0.5);
    }
    .btn-amber {
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.5);
    }
    .btn-cyan {
      background: rgba(6, 182, 212, 0.18);
      color: #a5f3fc;
      border-color: rgba(6, 182, 212, 0.5);
    }
    .btn-guard-on {
      background: linear-gradient(135deg, #06b6d4, #22c55e);
      color: #031510;
      border: none;
    }
    .btn-sm {
      padding: 8px 11px;
      font-size: 12px;
      border-radius: 10px;
    }

    /* Barra de diagnóstico */
    .diag-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .diag-item {
      background: #060b13;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
    }
    .diag-lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
    }
    .diag-val {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Banner rojo de error honesto */
    #mic-error-box {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(127, 29, 29, 0.45);
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fecaca;
      font-size: 13px;
      line-height: 1.45;
    }
    #mic-error-box.show {
      display: block;
    }
    .error-code-tag {
      display: inline-block;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
      color: #fca5a5;
    }

    /* Fila de opciones rápidas (Preamp, Audio Crudo, Guardia Squelch) */
    .options-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .opt-box {
      background: #060b13;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .opt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      gap: 8px;
    }
    .mono-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    input[type="range"] {
      width: 100%;
      accent-color: #22c55e;
      cursor: pointer;
    }
    .check-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
    }
    .check-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #06b6d4;
      flex-shrink: 0;
    }

    /* LED Guardia Squelch */
    .squelch-led-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #04080f;
      border: 1px solid var(--border);
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .squelch-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }
    .squelch-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.1s, box-shadow 0.1s;
    }
    .squelch-led.open {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e, 0 0 22px rgba(34, 197, 94, 0.6);
    }
    .squelch-status.open {
      color: #4ade80;
    }

    /* Layout responsivo 2 columnas (Horizontal / Landscape / Tablet / PC) */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 720px), (orientation: landscape) and (min-width: 600px) {
      .split-grid {
        grid-template-columns: 1.15fr 0.85fr;
      }
      .split-grid.equal {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Pantallas LCD y Canvas */
    .lcd-box {
      background: linear-gradient(180deg, #03080e 0%, #07121b 100%);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 14px;
      padding: 10px;
      box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.85);
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #02060b;
      border: 1px solid #162235;
    }
    #smeter-wrap { height: 210px; }
    #wave-wrap   { height: 155px; }
    #spec-wrap   { height: 155px; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lecturas digitales S-Meter */
    .digital-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .digital-cell {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #17253a;
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }
    .digital-lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
    }
    .digital-num {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 800;
      color: #4ade80;
      margin-top: 2px;
    }
    .digital-num.cyan { color: #22d3ee; font-size: 15px; }
    .digital-num.amber { color: #fbbf24; font-size: 15px; }
    .digital-num.red { color: #f87171; }

    /* Calibración */
    .cal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .cal-actions button {
      flex: 1 1 110px;
    }

    /* Reporte RS/RST */
    .mode-switch {
      display: inline-flex;
      background: #060b13;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .mode-switch button {
      padding: 6px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 7px;
    }
    .mode-switch button.active {
      background: rgba(6, 182, 212, 0.22);
      color: #22d3ee;
    }
    .report-big {
      font-family: var(--font-mono);
      font-size: 54px;
      font-weight: 800;
      line-height: 1.05;
      text-align: center;
      color: #4ade80;
      text-shadow: 0 0 14px rgba(34, 197, 94, 0.45);
      margin: 6px 0 2px 0;
    }
    .report-big.over { color: #f87171; text-shadow: 0 0 14px rgba(239, 68, 68, 0.55); }
    .report-over-tag {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      color: #f87171;
      min-height: 20px;
    }
    .phrase-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid #18273e;
      font-size: 13px;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.4;
    }
    .phrase-box small {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #fbbf24;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Botones de Legibilidad R */
    .r-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .r-grid button {
      padding: 8px 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 9px;
    }
    .r-grid button.active {
      background: rgba(6, 182, 212, 0.25);
      color: #67e8f9;
      border-color: rgba(6, 182, 212, 0.6);
    }

    /* Indicador CLIP */
    .clip-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      background: #111a2a;
      color: #64748b;
      border: 1px solid #1e2d45;
    }
    .clip-pill.active {
      background: #dc2626;
      color: #ffffff;
      border-color: #fca5a5;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.85);
    }

    /* Inputs y formularios */
    input[type="text"], select, textarea {
      width: 100%;
      background: #060b13;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #f1f5f9;
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #22c55e;
    }
    .mono-input {
      font-family: var(--font-mono);
      text-transform: uppercase;
    }

    /* Grabador y Transcripción */
    .rec-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    #rec-timer {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 10px;
      background: #060b13;
      border: 1px solid var(--border);
      color: #f8fafc;
    }
    audio {
      width: 100%;
      height: 40px;
      margin-top: 8px;
      color-scheme: dark;
    }
    .hidden {
      display: none !important;
    }

    /* Tabla Mini Log UTC */
    .log-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .log-form .full {
      grid-column: 1 / -1;
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #060b13;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 8px 8px;
      text-align: left;
      border-bottom: 1px solid rgba(30, 45, 69, 0.65);
      white-space: nowrap;
    }
    th {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      background: #0d1626;
    }
    td.mono {
      font-family: var(--font-mono);
    }
    .td-note {
      white-space: normal;
      min-width: 120px;
      max-width: 220px;
      color: #cbd5e1;
    }
    .call-edit {
      background: transparent;
      border: 1px solid transparent;
      color: #4ade80;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      width: 96px;
      padding: 3px 5px;
      border-radius: 6px;
      text-transform: uppercase;

    .call-edit:focus {
      background: #0b111b;
      border-color: #22c55e;
    }

    footer {
      text-align: center;
      padding: 14px 12px 24px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #64748b;
    }
