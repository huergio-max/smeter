<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>S-Meter Pro RX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060b14; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 10px; min-height: 100dvh;
    }
    .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #0f172a; border: 1px solid #1e293b;
      border-radius: 12px; padding: 12px;
    }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px;
    }
    .title { font-weight: 800; font-size: 1.05rem; color: #38bdf8; }
    .clock-box { text-align: right; font-family: monospace; }
    .utc { font-size: 1.35rem; font-weight: 800; color: #22c55e; }
    .subclock { font-size: 0.78rem; color: #94a3b8; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      flex: 1; min-width: 130px; padding: 12px 10px; border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    }
    .btn-mic { background: #22c55e; color: #052e16; }
    .btn-mic.active { background: #ef4444; color: #fff; }
    .btn-guard { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-guard.active { background: #f59e0b; color: #1c1917; border-color: #f59e0b; }
    .btn-log { background: #0284c7; color: #fff; }
    .status {
      font-family: monospace; font-size: 0.8rem; color: #94a3b8;
      background: #020617; padding: 8px 10px; border-radius: 6px;
      border-left: 3px solid #334155;
    }
    .status.ok { border-left-color: #22c55e; color: #86efac; }
    .status.err { border-left-color: #ef4444; color: #fca5a5; }
    .meter-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 680px) { .meter-grid { grid-template-columns: 1.2fr 1fr; } }
    canvas {
      width: 100%; display: block; background: #020617;
      border-radius: 8px; border: 1px solid #1e293b;
    }
    .readout {
      display: flex; justify-content: space-around; align-items: center;
      margin-top: 8px; text-align: center; font-family: monospace;
    }
    .big-s { font-size: 2rem; font-weight: 900; color: #38bdf8; }
    .big-rs { font-size: 1.6rem; font-weight: 800; color: #facc15; }
    .lbl { font-size: 0.72rem; color: #94a3b8; }
    .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .sl-item label { display: flex; justify-content: space-between; font-size: 0.78rem; color: #cbd5e1; margin-bottom: 4px; }
    input[type=range] { width: 100%; accent-color: #38bdf8; }
    .led-bar {
      display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
      font-weight: 700; margin-top: 8px;
    }
    .led { width: 12px; height: 12px; border-radius: 50%; background: #334155; }
    .led.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .log-list {
      max-height: 160px; overflow-y: auto; font-family: monospace;
      font-size: 0.78rem; margin-top: 8px;
    }
    .log-row {
      display: flex; justify-content: space-between; padding: 5px 0;
      border-bottom: 1px solid #1e293b; color: #cbd5e1;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card top">
    <div>
      <div class="title">S-Meter Pro RX</div>
      <div class="subclock">Monitor de Guardia &amp; Reportes RS</div>
    </div>
    <div class="clock-box">
      <div class="utc" id="utcTime">--:--:-- UTC</div>
      <div class="subclock" id="utcDate">----/--/-- | Local --:--:--</div>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <button id="btnMic" class="btn-mic">Activar Micrófono</button>
      <button id="btnGuard" class="btn-guard">Modo Guardia: OFF</button>
      <button id="btnSave" class="btn-log">Guardar Reporte UTC</button>
    </div>
    <div id="status" class="status" style="margin-top:8px;">Listo. Toca "Activar Micrófono" para comenzar.</div>
    <div class="led-bar">
      <div id="sqLed" class="led"></div>
      <span id="sqText">SQUELCH CERRADO</span>
    </div>
  </div>

  <div class="meter-grid">
    <div class="card">
      <canvas id="meterCanvas" height="170"></canvas>
      <div class="readout">
        <div><div class="big-s" id="valS">S0</div><div class="lbl">SEÑAL</div></div>
        <div><div class="big-rs" id="valRS">R1 S0</div><div class="lbl">REPORTE</div></div>
        <div><div class="big-rs" id="valDb" style="color:#94a3b8;font-size:1.2rem;">-90 dB</div><div class="lbl">NIVEL</div></div>
      </div>
      <div class="sliders">
        <div class="sl-item">
          <label><span>Ganancia Mic</span><span id="lblGain">2.0x</span></label>
          <input id="slGain" type="range" min="0.5" max="8" step="0.5" value="2" />
        </div>
        <div class="sl-item">
          <label><span>Squelch</span><span id="lblSq">S3</span></label>
          <input id="slSq" type="range" min="1" max="9" step="1" value="3" />
        </div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:8px;">
      <div class="lbl">FORMA DE ONDA (OSCILOSCOPIO)</div>
      <canvas id="waveCanvas" height="95"></canvas>
      <div class="lbl">ESPECTRO DE AUDIO (FFT)</div>
      <canvas id="fftCanvas" height="110"></canvas>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="lbl" style="font-weight:700;">REGISTRO UTC (ÚLTIMOS REPORTES)</span>
      <button id="btnCsv" style="flex:0;min-width:auto;padding:5px 10px;font-size:0.75rem;background:#1e293b;color:#cbd5e1;">Exportar CSV</button>
    </div>
    <div id="logList" class="log-list"></div>
  </div>
</div>

<script>
// 1. RELOJ UTC INDEPENDIENTE
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const uH = pad(now.getUTCHours()), uM = pad(now.getUTCMinutes()), uS = pad(now.getUTCSeconds());
  const uD = `${now.getUTCFullYear()}-${pad(now.getUTCMonth()+1)}-${pad(now.getUTCDate())}`;
  const lT = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('utcTime').textContent = `${uH}:${uM}:${uS} UTC`;
  document.getElementById('utcDate').textContent = `${uD} | Local ${lT}`;
}
setInterval(updateClock, 250);
updateClock();

// 2. VARIABLES DE AUDIO Y ESTADO
let audioCtx = null, stream = null, analyser = null, gainNode = null, rafId = null;
let wakeLock = null, guardOn = false;
let smoothS = 0, currentSLabel = 'S0', currentRS = 'R1 S0', currentDb = -90;
let logs = [];
try { logs = JSON.parse(localStorage.getItem('smeter_logs') || '[]'); } catch(e) {}

const statusEl = document.getElementById('status');
const btnMic = document.getElementById('btnMic');
const btnGuard = document.getElementById('btnGuard');
const slGain = document.getElementById('slGain');
const slSq = document.getElementById('slSq');

function setStatus(msg, cls='') {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + cls;
}

// 3. ACTIVAR / DETENER MICRÓFONO (ANDROID SAFE)
btnMic.addEventListener('click', async () => {
  if (stream) { stopMic(); return; }
  try {
    setStatus('Solicitando permiso de micrófono...');
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const src = audioCtx.createMediaStreamSource(stream);
    gainNode = audioCtx.createGain();
    gainNode.gain.value = parseFloat(slGain.value);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.75;

    // Mute gain a destination para evitar que Chrome Android duerma el grafo
    const mute = audioCtx.createGain();
    mute.gain.value = 0;

    src.connect(gainNode);
    gainNode.connect(analyser);
    analyser.connect(mute);
    mute.connect(audioCtx.destination);

    btnMic.textContent = 'Detener Micrófono';
    btnMic.classList.add('active');
    setStatus('Micrófono ACTIVO — Recibiendo audio en vivo', 'ok');
    loop();
  } catch (err) {
    setStatus('Error de micrófono: ' + err.name + ' - ' + err.message, 'err');
  }
});

function stopMic() {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  stream = null; audioCtx = null; analyser = null;
  btnMic.textContent = 'Activar Micrófono';
  btnMic.classList.remove('active');
  setStatus('Micrófono detenido.');
}

slGain.addEventListener('input', () => {
  document.getElementById('lblGain').textContent = parseFloat(slGain.value).toFixed(1) + 'x';
  if (gainNode) gainNode.gain.value = parseFloat(slGain.value);
});
slSq.addEventListener('input', () => {
  document.getElementById('lblSq').textContent = 'S' + slSq.value;
});

// 4. MODO GUARDIA (WAKE LOCK)
btnGuard.addEventListener('click', async () => {
  guardOn = !guardOn;
  btnGuard.classList.toggle('active', guardOn);
  btnGuard.textContent = guardOn ? 'Modo Guardia: ON' : 'Modo Guardia: OFF';
  if (guardOn && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
  } else if (wakeLock) {
    try { await wakeLock.release(); wakeLock = null; } catch(e) {}
  }
});

// 5. DIBUJO S-METER, ONDA Y ESPECTRO
const mCan = document.getElementById('meterCanvas'), mCtx = mCan.getContext('2d');
const wCan = document.getElementById('waveCanvas'), wCtx = wCan.getContext('2d');
const fCan = document.getElementById('fftCanvas'), fCtx = fCan.getContext('2d');

function drawMeter(sVal) {
  const w = mCan.width = mCan.clientWidth || 300;
  const h = mCan.height = 170;
  mCtx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h - 18, r = Math.min(w * 0.42, 130);

  // Arco S1-S9 (verde/cyan) y +10/+60 (rojo)
  mCtx.lineWidth = 10;
  mCtx.beginPath(); mCtx.arc(cx, cy, r, Math.PI, Math.PI * 1.65);
  mCtx.strokeStyle = '#0ea5e9'; mCtx.stroke();
  mCtx.beginPath(); mCtx.arc(cx, cy, r, Math.PI * 1.65, Math.PI * 2);
  mCtx.strokeStyle = '#ef4444'; mCtx.stroke();

  // Etiquetas
  const marks = ['1','3','5','7','9','+20','+40'];
  mCtx.fillStyle = '#94a3b8'; mCtx.font = 'bold 11px monospace'; mCtx.textAlign = 'center';
  marks.forEach((txt, i) => {
    const ang = Math.PI + (i / (marks.length - 1)) * Math.PI;
    mCtx.fillText(txt, cx + Math.cos(ang) * (r - 20), cy + Math.sin(ang) * (r - 20));
  });

  // Aguja (sVal de 0 a 15 -> S0 a S9+60)
  const norm = Math.max(0, Math.min(1, sVal / 15));
  const ang = Math.PI + norm * Math.PI;
  mCtx.beginPath(); mCtx.moveTo(cx, cy);
  mCtx.lineTo(cx + Math.cos(ang) * (r - 6), cy + Math.sin(ang) * (r - 6));
  mCtx.strokeStyle = '#facc15'; mCtx.lineWidth = 3; mCtx.stroke();
  mCtx.beginPath(); mCtx.arc(cx, cy, 6, 0, Math.PI * 2);
  mCtx.fillStyle = '#e2e8f0'; mCtx.fill();
}
drawMeter(0);

function loop() {
  if (!analyser) return;
  rafId = requestAnimationFrame(loop);

  const timeData = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(timeData);
  const freqData = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);

  // Calcular RMS -> dBFS -> Unidades S
  let sum = 0;
  for (let i = 0; i < timeData.length; i++) sum += timeData[i] * timeData[i];
  const rms = Math.sqrt(sum / timeData.length);
  const db = rms > 0.00001 ? 20 * Math.log10(rms) : -90;
  currentDb = Math.round(db);

  // Mapeo práctico: -70 dBFS = S1, -22 dBFS = S9 (6 dB por unidad S)
  const rawS = Math.max(0, Math.min(15, (db + 76) / 6));
  smoothS = smoothS * 0.75 + rawS * 0.25;

  const sInt = Math.round(smoothS);
  if (sInt <= 9) {
    currentSLabel = 'S' + sInt;
  } else {
    currentSLabel = 'S9+' + ((sInt - 9) * 10);
  }
  const rVal = sInt >= 7 ? 5 : sInt >= 5 ? 4 : sInt >= 3 ? 3 : sInt >= 1 ? 2 : 1;
  currentRS = `R${rVal} ${currentSLabel}`;

  document.getElementById('valS').textContent = currentSLabel;
  document.getElementById('valRS').textContent = currentRS;
  document.getElementById('valDb').textContent = `${currentDb} dB`;
  drawMeter(smoothS);

  // Squelch
  const sqOpen = smoothS >= parseInt(slSq.value, 10);
  document.getElementById('sqLed').classList.toggle('on', sqOpen);
  document.getElementById('sqText').textContent = sqOpen ? `RX ACTIVO (${currentRS})` : 'SQUELCH CERRADO';

  // Onda
  const ww = wCan.width = wCan.clientWidth || 300, wh = wCan.height = 95;
  wCtx.clearRect(0, 0, ww, wh);
  wCtx.strokeStyle = '#38bdf8'; wCtx.lineWidth = 1.5; wCtx.beginPath();
  for (let i = 0; i < timeData.length; i++) {
    const x = (i / timeData.length) * ww;
    const y = (0.5 - timeData[i] * 0.48) * wh;
    if (i === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
  }
  wCtx.stroke();

  // Espectro FFT
  const fw = fCan.width = fCan.clientWidth || 300, fh = fCan.height = 110;
  fCtx.clearRect(0, 0, fw, fh);
  const bars = 64;
  const bw = fw / bars;
  for (let i = 0; i < bars; i++) {
    const v = freqData[i * 2] / 255;
    const bh = v * fh;
    fCtx.fillStyle = v > 0.7 ? '#ef4444' : v > 0.4 ? '#facc15' : '#22c55e';
    fCtx.fillRect(i * bw, fh - bh, bw - 1, bh);
  }
}

// 6. MINI LOG UTC
function renderLogs() {
  const el = document.getElementById('logList');
  if (!logs.length) { el.innerHTML = '<div class="subclock">Sin registros todavía.</div>'; return; }
  el.innerHTML = logs.map(l =>
    `<div class="log-row"><span>${l.utc}</span><span><b>${l.rs}</b> (${l.db} dB)</span></div>`
  ).join('');
}
renderLogs();

document.getElementById('btnSave').addEventListener('click', () => {
  const now = new Date();
  const utc = now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  logs.unshift({ utc, rs: currentRS, db: currentDb });
  if (logs.length > 50) logs.pop();
  try { localStorage.setItem('smeter_logs', JSON.stringify(logs)); } catch(e) {}
  renderLogs();
});

document.getElementById('btnCsv').addEventListener('click', () => {
  const csv = 'Fecha_Hora_UTC,Reporte_RS,Nivel_dBFS\n' + logs.map(l => `${l.utc},${l.rs},${l.db}`).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'smeter_log_utc.csv';
  a.click();
});
</script>
</body>
</html>
